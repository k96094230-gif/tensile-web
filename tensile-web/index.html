*{box-sizing:border-box}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

.gmeta{flex:1;display:grid;gap:4px;min-width:0}.gbar{height:6px;border-radius:99px;background:var(--chip);overflow:hidden}.gbar i{display:block;height:100%;background:var(--accent,#0A84FF);border-radius:99px;transition:width .9s linear}
.gst{display:flex;gap:6px}.gerr{color:#B3261E;font-size:12.5px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.ggrid figure{margin:0;background:var(--panel);border-radius:var(--r2);box-shadow:var(--sh1);overflow:hidden}
.ggrid video,.ggrid .gimg{display:block;width:100%;aspect-ratio:var(--far,16/9);background:#111;object-fit:contain;position:relative}.ggrid figcaption{padding:10px 12px;display:grid;gap:6px;font-size:13px}

const DECK_CSS=`
.dk{container-type:inline-size;aspect-ratio:16/9;position:relative;background:linear-gradient(180deg,var(--deck-a),var(--deck-b));color:var(--deck-ink);overflow:hidden;font-family:var(--f-body)}
.dki{position:absolute;inset:0;padding:2.4cqw 2.8cqw;display:flex;flex-direction:column;gap:1.3cqw;font-size:1.05cqw;line-height:1.5}
.dkh{display:flex;align-items:baseline;gap:1cqw;border-bottom:.12cqw solid var(--deck-line);padding-bottom:.6cqw}
.dkh b{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:1.25cqw;letter-spacing:.02em}
.dkh span{font-size:1cqw}
.dkh i{margin-left:auto;font-style:normal;font-family:var(--f-display);font-weight:700;font-size:.85cqw}
.dkc{display:flex;gap:.8cqw}
.dkc span{flex:1;text-align:center;padding:.45cqw 0;border-radius:.35cqw;background:var(--deck-chip);color:var(--deck-chip-ink);font-size:.9cqw;font-weight:700;box-shadow:0 .25cqw .5cqw rgba(0,0,0,.22);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkc span.on{background:var(--deck-chip-on)}
.dkg{flex:1;display:grid;grid-template-columns:2.2cqw repeat(3,1fr);grid-template-rows:auto auto 1fr;gap:1cqw 2.4cqw;min-height:0}
.dkl{writing-mode:vertical-rl;font-family:var(--f-display);font-weight:700;font-size:.9cqw;letter-spacing:.06em}
.dks{font-family:var(--f-display);font-weight:700;font-size:.85cqw;margin-bottom:.4cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkp{aspect-ratio:16/9;background:var(--deck-box);box-shadow:0 .5cqw 1.2cqw rgba(0,0,0,.28);display:grid;place-items:center;overflow:hidden;font-size:.9cqw;position:relative}
.dkp img,.dkp video{width:100%;height:100%;object-fit:cover;display:block}
.dkp em{position:absolute;left:.6cqw;top:.4cqw;font-style:normal;font-family:var(--f-display);font-weight:800;font-size:.7cqw;letter-spacing:.1em;color:#fff;mix-blend-mode:difference;z-index:1}
.dka{font-size:1cqw;font-weight:500;white-space:pre-wrap;overflow:hidden}
.dkt{width:100%;border-collapse:collapse;font-size:.82cqw;align-self:start}
.dkt td{border:.08cqw solid var(--deck-line);padding:.3cqw .5cqw;width:32%}
.dkt td:nth-child(odd){width:18%;font-weight:700;text-align:center;white-space:nowrap}
.dko{flex:1;display:flex;flex-direction:column;gap:1.4cqw;min-height:0;overflow:hidden}
.dko h4{margin:0 0 .5cqw;font-size:.95cqw;font-weight:700}
.dkr{display:grid;grid-template-columns:repeat(6,1fr);gap:1.4cqw}
.dkr .dkp{box-shadow:0 .3cqw .8cqw rgba(0,0,0,.25)}
.dkt1{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1cqw}
.dkt1 h3{margin:0;font-size:4.2cqw;line-height:1.1;font-weight:700;letter-spacing:0;color:inherit}
.dkt1 p{margin:0;font-size:1.2cqw}
.dkm{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw 2.4cqw;align-content:center}
.dkm p{margin:.5cqw 0 0;font-size:1cqw}
.dkb{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:4cqw;align-content:center}
.dkb h3{margin:0 0 1.6cqw;font-size:2.8cqw;line-height:1.35;font-weight:700;white-space:pre-wrap;color:inherit;letter-spacing:0;text-transform:none;font-family:inherit}
.dkb p{margin:0;font-size:1.1cqw;line-height:1.9;white-space:pre-wrap}
.dkb dl{margin:0;display:grid;gap:1.2cqw;align-content:center}
.dkb dt{font-size:.8cqw;font-weight:700;letter-spacing:.08em;opacity:.7}
.dkb dd{margin:.2cqw 0 0;font-size:1cqw;line-height:1.7;white-space:pre-wrap}
.dkf{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1.6cqw 2cqw;align-content:start}
.dkf figure{margin:0}.dkf .dkp{aspect-ratio:4/3}.dkf figcaption{font-size:.85cqw;margin-top:.6cqw}
.dkp>span{font-size:.9cqw;opacity:.6}
.dk h3,.dk h4{color:inherit;letter-spacing:0;text-transform:none;font-family:inherit;font-stretch:normal}
.dkcv{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4cqw;align-items:center;min-height:0}
.dkcv .k{font-size:.8cqw;letter-spacing:.22em;font-weight:700;border-left:.3cqw solid var(--deck-ink);padding-left:.8cqw}
.dkcv h3{font-size:3.6cqw;line-height:1.25;margin:1.6cqw 0;white-space:pre-wrap;font-weight:700}
.dkcv p{font-size:1.15cqw;margin:0;white-space:pre-wrap;line-height:1.7}
.dkcv p.m{margin-top:2.4cqw;font-size:.9cqw;opacity:.7}
.dkcv .dkp.tall{aspect-ratio:auto;height:36cqw}
.dktx{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.4cqw;padding:0 5cqw;min-height:0}
.dktx .e{font-size:.85cqw;letter-spacing:.22em;font-weight:700;opacity:.7;min-height:1em}
.dktx h3{font-size:3.2cqw;margin:0;line-height:1.25;white-space:pre-wrap;font-weight:700}
.dktx p{font-size:1.3cqw;line-height:1.9;margin:0;white-space:pre-wrap;max-width:60cqw}
.dksp{flex:1;display:grid;grid-template-columns:1.2fr 1fr;gap:2cqw;align-items:center;min-height:0}
.dksp .dkp{aspect-ratio:auto;height:36cqw}.dksp .dktx{padding:0 2cqw}
.dkfull{background:#0E0F11;color:#F5F5F7}
.dkim{position:absolute;inset:0;display:grid;place-items:center}.dkim img{width:100%;height:100%;object-fit:cover;display:block}
.dkcap{position:absolute;left:4cqw;right:30cqw;bottom:3.5cqw;color:#fff;text-shadow:0 .1cqw .6cqw rgba(0,0,0,.6)}
.dkcap h3{font-size:2.6cqw;margin:0 0 .6cqw;font-weight:700}.dkcap p{font-size:1.1cqw;margin:0;white-space:pre-wrap}
.dkls{border-collapse:collapse;width:100%;max-width:70cqw;margin-top:1.4cqw}
.dkls td{padding:.9cqw 1cqw .9cqw 0;border-bottom:.08cqw solid var(--deck-line);font-size:1.2cqw}
.dkls td:first-child{width:22%;opacity:.7}
.dkend{flex:1;display:grid;place-items:center;text-align:center}
.dkend h3{font-size:3.2cqw;margin:0 0 1.4cqw;white-space:pre-wrap;line-height:1.35;font-weight:700}
.dkend p{font-size:1cqw;margin:0;letter-spacing:.06em;opacity:.75;max-width:60cqw}
.fi{position:absolute;inset:0;display:block;background:center/contain no-repeat}
.dkp{aspect-ratio:var(--far,16/9)}
.dkp video{object-fit:contain}
.dk.tall .dkg .dkp{height:19cqw;width:auto;max-width:100%;margin-inline:auto}
.dk.tall .dkr{grid-template-columns:repeat(10,1fr)}
.dk.tall .dkr .dkp{height:10cqw;width:auto;max-width:100%}
.dk.tall .dkm .dkp{height:19cqw;width:auto;max-width:100%;margin-inline:auto}
.dkim .fi{background-size:contain}
.rl{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 22cqw;gap:2.4cqw;min-height:0}
.rls{position:relative;background:#0E0F11;overflow:hidden;box-shadow:0 .5cqw 1.2cqw rgba(0,0,0,.28);align-self:center;aspect-ratio:var(--far,16/9);max-height:44cqw;max-width:100%;justify-self:center;height:100%;width:auto}
.dk:not(.tall) .rls{width:100%;height:auto}
.rlf{position:absolute;inset:0;opacity:0}
.rlf .fi{transform-origin:50% 50%}
.rlf video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.rlf .ph{position:absolute;inset:0;display:grid;place-items:center;color:#9A9CA1;font-size:1.4cqw;text-align:center}
.rlf .cap{position:absolute;left:6%;right:6%;bottom:6%;text-align:center;color:#fff;font-size:1.15cqw;text-shadow:0 .1cqw .5cqw rgba(0,0,0,.8)}
.rlf .no{position:absolute;left:1.2cqw;top:1cqw;color:#fff;font-family:var(--f-display);font-weight:800;font-size:.8cqw;letter-spacing:.08em;text-shadow:0 .1cqw .4cqw rgba(0,0,0,.6)}
.rlb{position:absolute;left:0;bottom:0;height:.3cqw;background:#fff;width:0}
.rli{display:flex;flex-direction:column;gap:.8cqw;min-height:0;overflow:hidden;font-size:.95cqw}
.rli b{font-size:1.5cqw}
.rli ol{margin:0;padding:0;list-style:none;display:grid;gap:.35cqw;overflow:hidden}
.rli li{display:flex;gap:.8cqw;border-bottom:.08cqw solid var(--deck-line);padding-bottom:.3cqw}

/* ---------- frame aspect ratio ---------- */
const RATIOS=[['auto','自動（依素材）'],['16:9','16:9 橫式'],['9:16','9:16 直式'],['1:1','1:1 方形'],['4:5','4:5 直式'],['4:3','4:3'],['2.39:1','2.39:1 寬銀幕']];
const STDR=[16/9,9/16,1,4/5,4/3,3/4,2.39,1.85,3/2,2/3];
function snapAR(x){let b=STDR[0];STDR.forEach(s=>{if(Math.abs(Math.log(s/x))<Math.abs(Math.log(b/x)))b=s});return Math.abs(Math.log(b/x))<.06?b:Math.round(x*100)/100}
function frameAR(){const v=(S.docs.brief&&S.docs.brief.meta.ratio)||'auto';if(v!=='auto'){const [a,b]=v.split(':').map(Number);if(a&&b)return a/b}
  const c=new Map();(S.docs.shots?shots():[]).forEach(r=>{const x=r.ar||r.mar;if(x){const k=snapAR(x);c.set(k,(c.get(k)||0)+1)}});let best=16/9,n=0;c.forEach((v,k)=>{if(v>n){n=v;best=k}});return best}
const arLabel=f=>{const m={[16/9]:'16:9',[9/16]:'9:16',1:'1:1',[4/5]:'4:5',[4/3]:'4:3',[3/4]:'3:4',2.39:'2.39:1',1.85:'1.85:1',[3/2]:'3:2',[2/3]:'2:3'};return m[f]||(Math.round(f*100)/100+':1')};
function applyAR(){const f=frameAR(),de=document.documentElement;de.style.setProperty('--far',String(f));de.classList.toggle('tall',f<1.3)}

const ARC={};
function measure(url,vid){if(ARC[url]!==undefined)return Promise.resolve(ARC[url]);return new Promise(res=>{const done=v=>{ARC[url]=v&&isFinite(v)?Math.round(v*10000)/10000:0;res(ARC[url])};
  if(vid){const v=document.createElement('video');v.preload='metadata';v.muted=true;v.onloadedmetadata=()=>done(v.videoWidth/v.videoHeight);v.onerror=()=>done(0);v.src=url}
  else{const im=new Image();im.onload=()=>done(im.naturalWidth/im.naturalHeight);im.onerror=()=>done(0);im.src=url}})}

  Promise.all(need.map(async r=>{if(r.img&&!r.ar){const a=await measure(imgSrc(r.img));if(a)r.ar=a}if(r.motion&&!r.mar){const a=await measure(imgSrc(r.motion),true);if(a)r.mar=a}})).then(()=>{arBusy=false;if(S.pid!==pid)return;if(need.some(r=>r.ar||r.mar)){touch('shots');const before=getComputedStyle(document.documentElement).getPropertyValue('--far');applyAR();if(String(frameAR())!==before.trim())softRefresh()}})}

function path(key){return key==='@p'?`projects/${S.pid}`:key==='@s'?'studio/info':`projects/${S.pid}/m/${key}`}
function body(key){return key==='@p'?clean(S.projects[S.pid]):key==='@s'?clean(S.studio):clean(getDoc(key))}
function touch(key){
  if(key!=='@p'&&key!=='@s'){delete getDoc(key)._new;const pj=S.projects[S.pid];if(pj&&(!pj._ut||Date.now()-pj._ut>60000)){pj._ut=Date.now();pj.updatedAt=new Date().toISOString();touch('@p')}}
  if(S.local){ls.set('tdesk',{projects:S.projects,all:Object.assign(ls.get('tdesk')?.all||{},{[S.pid]:clean(S.docs)}),studio:S.studio});return}
  const p=path(key);S.keys[p]=key;S.pending[p]=true;S.seq[p]=(S.seq[p]||0)+1;clearTimeout(S.timers[p]);S.timers[p]=setTimeout(()=>flush(key,p),700)}
async function flush(key,p){
  if(S.writing[p]){S.timers[p]=setTimeout(()=>flush(key,p),300);return}
  if(p!==path(key)){S.pending[p]=false;return}
  S.writing[p]=true;const at=S.seq[p];
  try{await S.db.doc(p).set(body(key))}catch(e){S.ro=true;toast(e&&e.code==='permission_denied'?'你沒有編輯權限，變更不會儲存':'儲存失敗：'+(e&&e.message||e))}
  S.writing[p]=false;if(S.seq[p]===at)S.pending[p]=false}
function flushNow(){if(!S.db||!S.pid)return;Object.keys(S.pending).forEach(p=>{if(!S.pending[p]||!S.keys[p])return;clearTimeout(S.timers[p]);let b;try{b=body(S.keys[p])}catch(e){S.pending[p]=false;return}S.seq[p]=(S.seq[p]||0)+1;S.db.doc(p).set(b).catch(()=>{}).finally(()=>{S.pending[p]=false})})}

      snap.docs.forEach(d=>{if(S.pending[`projects/${pid}/m/${d.id}`])return;const nv=dc(d.data());if(stable(nv)!==stable(S.docs[d.id]||null)){S.docs[d.id]=nv;hit=true}});

function slGroups(rows,mode){if(!SLK[mode])return [{name:'',vals:null,rows,empty:false}];const ks=SLK[mode],m=new Map();

/* ---------- drag to reorder (pointer events, mouse + touch) ---------- */
function drFind(e){for(const c of SORTC.slice().reverse()){if(!c.el.isConnected||!c.el.contains(e.target))continue;const it=e.target.closest(c.o.draggable);if(!it||it.parentElement!==c.el)continue;

async function makePDF(nodes,name,deck){
  await loadLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas);
  await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf);
  try{await document.fonts.ready}catch(e){}
  const {jsPDF}=window.jspdf;let pdf=null;const SC=3;
  for(const el of nodes){
    const top=el.getBoundingClientRect().top,eh=el.offsetHeight||1;
    const marks=deck?[]:[...el.querySelectorAll('tr,h4,.rc,.kv,.two,.sum,.terms,.sign,.sb,.foot,.ph1')].map(x=>x.getBoundingClientRect().bottom-top).filter(v=>v>0).sort((a,b)=>a-b);
    const cv=await html2canvas(el,{scale:SC,backgroundColor:'#ffffff',useCORS:true,logging:false,onclone:d=>d.documentElement.setAttribute('data-theme','light')});
    if(deck){const W=960,H=540;if(!pdf)pdf=new jsPDF({orientation:'landscape',unit:'pt',format:[W,H],compress:true});else pdf.addPage([W,H],'landscape');pdf.addImage(cv.toDataURL('image/jpeg',.93),'JPEG',0,0,W,H,undefined,'FAST');continue}
    const W=595.28,H=841.89,step=Math.floor(cv.width*H/W),k=cv.height/eh,cuts=marks.map(m=>Math.round(m*k));
    let y=0;while(y<cv.height-4){let end=cv.height-y>step+12?y+step:cv.height;if(end<cv.height){const ok=cuts.filter(c=>c>y+step*.5&&c<=end);if(ok.length)end=ok[ok.length-1]}
      const hp=end-y,c=document.createElement('canvas');c.width=cv.width;c.height=hp;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,hp);g.drawImage(cv,0,y,cv.width,hp,0,0,cv.width,hp);
      if(!pdf)pdf=new jsPDF({unit:'pt',format:'a4',compress:true});else pdf.addPage('a4','portrait');pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,W,hp*W/cv.width,undefined,'FAST');y=end}}
  if(!pdf)throw new Error('沒有可以輸出的頁面');
  return pdf.output('blob')}

  try{const o=await S.sample.json(`你是廣告導演。依這顆鏡頭的內容與前後鏡頭，建議拍法。只回傳 JSON 物件：{"size":景別（只能是：${SIZES.join('、')}）,"move":運鏡（只能是：${MOVES.join('、')}）,"sec":建議秒數（數字）,"sound":旁白、台詞或聲音建議（沒有就空字串）,"note":一句拍攝提醒（繁體中文，20 字內）}。\n\n專案：${(S.projects[S.pid]||{}).name||''}\n這顆鏡頭：${shotNo(r)} ${r.title||''}\n畫面：${r.action||''}\n場景：${r.scene||''}\n前後鏡頭：\n${near}`);
    const got=[];if(SIZES.includes(o.size)&&!r.size){r.size=o.size;got.push('景別')}if(MOVES.includes(o.move)&&!r.move){r.move=o.move;got.push('運鏡')}
    if(Number(o.sec)&&!r.sec){r.sec=Number(o.sec);got.push('秒數')}if(o.sound&&!r.sound){r.sound=String(o.sound);got.push('聲音')}
    if(o.note){r.note=(r.note?r.note+'\n':'')+'AI：'+String(o.note);got.push('提醒')}
    touch('shots');render();toast(got.length?'已填入 '+got.join('、')+'（原本有寫的欄位不會被改）':'欄位都已經填好了')}
  catch(e){aiErr(e);btn.disabled=false;btn.textContent='AI 建議鏡頭'}}
async function aiBrief(btn){
  const p=S.projects[S.pid]||{},rows=shots(),m=getDoc('brief').meta;
  if(!rows.length&&!m.concept){toast('先寫一些鏡頭或創意概念');return}
  btn.disabled=true;btn.textContent='撰寫中…';
  const outline=segs(rows).map(sg=>`【${sg}】`+rows.filter(r=>segOf(r)===sg).map(r=>`${r.title||''}：${r.action||''}${r.sound?'（'+r.sound+'）':''}`).join('；')).join('\n');
  try{const o=await S.sample.json(`你是廣告提案的創意總監。依專案資訊與分鏡大綱，寫提案的「創意與視覺方向」。繁體中文、具體、不浮誇。只回傳 JSON 物件，鍵為：${BRIEF.map(([k,l])=>k+'（'+l+'）').join('、')}。title 是 15 字內的主標語；concept 三到四句；其他欄位各一到兩句。\n\n專案：${p.name||''}　客戶：${p.client||''}　類型：${p.type||''}\n已寫的內容：${BRIEF.filter(([k])=>m[k]).map(([k,l])=>l+'：'+m[k]).join('；')||'無'}\n分鏡大綱：\n${outline.slice(0,8000)}`);
    const got=[];BRIEF.forEach(([k,l])=>{if(o[k]&&!String(m[k]||'').trim()){m[k]=String(o[k]);got.push(l)}});
    touch('brief');render();toast(got.length?'已填入 '+got.length+' 個欄位（原本有寫的不會被改）':'欄位都已經填好了')}
  catch(e){aiErr(e);btn.disabled=false;btn.textContent='AI 寫提案方向'}}
window.TENSILE_GENWIN||window.addEventListener('hashchange',()=>{S.linkEdit=false;S.open=null;S.pv.play=false;render();window.scrollTo(0,0)});
if(window.TENSILE_GENWIN)genWinBoot();else boot();
</script>
